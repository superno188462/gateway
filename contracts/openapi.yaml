openapi: 3.1.0
info:
  title: Agent Gateway API
  description: Agent 网关中台后端，提供账户、项目、服务管理和模型网关接口。
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - Health
      summary: 检查应用进程是否可响应
      description: 返回进程存活状态，不访问外部依赖。
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - Health
      summary: 检查应用是否可接收依赖数据库的请求
      description: 验证数据库可用性，并将底层异常转换为安全的稳定错误。
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: 注册普通用户
      description: 创建普通用户，注册接口不会创建管理员。
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: 用户名已存在
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 用户登录
      description: 验证用户凭据并签发包含角色的短期 Bearer 令牌。
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 用户退出
      description: 撤销当前令牌；客户端也应清理本地令牌。
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: 令牌无效或缺失
      security:
      - HTTPBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: 获取当前用户
      description: 返回当前登录用户的非敏感信息。
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 令牌无效或缺失
      security:
      - HTTPBearer: []
  /api/admin/v1/projects:
    post:
      tags:
      - Projects
      summary: 创建项目
      description: 任何已登录用户都可以创建项目，创建者自动成为 owner。
      operationId: create_project_api_admin_v1_projects_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Projects
      summary: 筛选和分页查询可访问项目
      description: 管理员查询全部项目；普通用户查询可见项目，并支持关键词、标签、状态和分页。
      operationId: list_projects_api_admin_v1_projects_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Query
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 20
          - type: 'null'
          title: Tag
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - inactive
            type: string
          - type: 'null'
          title: Status
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/tags:
    get:
      tags:
      - Projects
      summary: 查询可见项目的标签建议
      description: 返回当前用户可查看项目中的标签，供项目列表筛选。
      operationId: list_project_tags_api_admin_v1_projects_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Project Tags Api Admin V1 Projects Tags Get
      security:
      - HTTPBearer: []
  /api/admin/v1/projects/{project_id}:
    get:
      tags:
      - Projects
      summary: 查看项目
      operationId: get_project_api_admin_v1_projects__project_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: 更新项目
      operationId: update_project_api_admin_v1_projects__project_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Projects
      summary: 删除项目
      description: 永久删除项目及其标签、成员关系；仅项目 owner 可以删除。
      operationId: delete_project_api_admin_v1_projects__project_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/members:
    get:
      tags:
      - Projects
      summary: 查询项目成员
      operationId: list_members_api_admin_v1_projects__project_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
                title: Response List Members Api Admin V1 Projects  Project Id  Members
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Projects
      summary: 添加项目成员
      operationId: add_member_api_admin_v1_projects__project_id__members_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/members/{member_user_id}:
    delete:
      tags:
      - Projects
      summary: 移除项目成员
      operationId: remove_member_api_admin_v1_projects__project_id__members__member_user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: member_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Member User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: 修改项目成员角色
      operationId: update_member_role_api_admin_v1_projects__project_id__members__member_user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: member_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Member User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRoleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/resources/directories:
    get:
      tags:
      - Project Resources
      summary: 查询项目固定资源目录
      description: 返回固定目录分类；目录不可新增、重命名或删除。
      operationId: list_resource_directories_api_admin_v1_projects__project_id__resources_directories_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceDirectoryResponse'
                title: Response List Resource Directories Api Admin V1 Projects  Project
                  Id  Resources Directories Get
        '401':
          description: 需要有效登录令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '403':
          description: 无权访问该项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '404':
          description: 项目或资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/resources:
    get:
      tags:
      - Project Resources
      summary: 列出项目资源
      description: 按项目访问权限列出有效资源；默认返回六个固定目录的全部资源。
      operationId: list_resources_api_admin_v1_projects__project_id__resources_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: resource_type
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - memory
            - template
            type: string
          - type: 'null'
          description: 固定资源类型。若提供则必须同时提供 category。
          title: Resource Type
        description: 固定资源类型。若提供则必须同时提供 category。
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - sessions
            - profiles
            - longterm
            - system
            - user
            - assistant
            type: string
          - type: 'null'
          description: 固定目录分类。
          title: Category
        description: 固定目录分类。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceResponse'
                title: Response List Resources Api Admin V1 Projects  Project Id  Resources
                  Get
        '401':
          description: 需要有效登录令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '403':
          description: 无权访问该项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '404':
          description: 项目或资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Project Resources
      summary: 创建项目资源
      description: 创建目录内同名唯一的资源；需有项目 owner/editor 权限。
      operationId: create_resource_api_admin_v1_projects__project_id__resources_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '401':
          description: 需要有效登录令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '403':
          description: 无权访问该项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '404':
          description: 项目或资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '409':
          description: 名称冲突或资源版本已过期。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '422':
          description: 请求字段或固定目录无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
  /api/admin/v1/projects/{project_id}/resources/{resource_id}:
    get:
      tags:
      - Project Resources
      summary: 读取项目资源
      description: 同时按项目 ID 和资源 ID 查找，防止跨项目读取。
      operationId: get_resource_api_admin_v1_projects__project_id__resources__resource_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '401':
          description: 需要有效登录令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '403':
          description: 无权访问该项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '404':
          description: 项目或资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Project Resources
      summary: 更新项目资源
      description: 版本匹配时更新并递增版本；陈旧版本返回 409 version_conflict。
      operationId: update_resource_api_admin_v1_projects__project_id__resources__resource_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '401':
          description: 需要有效登录令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '403':
          description: 无权访问该项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '404':
          description: 项目或资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '409':
          description: 名称冲突或资源版本已过期。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '422':
          description: 请求字段或固定目录无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
    delete:
      tags:
      - Project Resources
      summary: 软删除项目资源
      description: 版本匹配时设置软删除时间；删除项从默认目录列表中隐藏。
      operationId: delete_resource_api_admin_v1_projects__project_id__resources__resource_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Resource Id
      - name: expected_version
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
          description: 最近读取的资源版本。
          title: Expected Version
        description: 最近读取的资源版本。
      responses:
        '204':
          description: Successful Response
        '401':
          description: 需要有效登录令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '403':
          description: 无权访问该项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '404':
          description: 项目或资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '409':
          description: 名称冲突或资源版本已过期。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
        '422':
          description: 请求字段或固定目录无效。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceErrorResponse'
  /api/admin/v1/projects/{project_id}/keys:
    get:
      tags:
      - API Keys
      summary: 查询项目 API Key
      operationId: list_api_keys_api_admin_v1_projects__project_id__keys_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyResponse'
                title: Response List Api Keys Api Admin V1 Projects  Project Id  Keys
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - API Keys
      summary: 创建项目 API Key
      operationId: create_api_key_api_admin_v1_projects__project_id__keys_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/keys/{key_id}:
    delete:
