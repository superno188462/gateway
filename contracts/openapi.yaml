openapi: 3.1.0
info:
  title: Agent Gateway API
  description: Agent 网关中台后端，提供账户、项目、服务管理和模型网关接口。
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - Health
      summary: 检查应用进程是否可响应
      description: 返回进程存活状态，不访问外部依赖。
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - Health
      summary: 检查应用是否可接收依赖数据库的请求
      description: 验证数据库可用性，并将底层异常转换为安全的稳定错误。
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: 注册普通用户
      description: 创建普通用户，注册接口不会创建管理员。
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: 用户名已存在
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 用户登录
      description: 验证用户凭据并签发包含角色的短期 Bearer 令牌。
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 用户退出
      description: 撤销当前令牌；客户端也应清理本地令牌。
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: 令牌无效或缺失
      security:
      - HTTPBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: 获取当前用户
      description: 返回当前登录用户的非敏感信息。
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 令牌无效或缺失
      security:
      - HTTPBearer: []
  /api/admin/v1/projects:
    post:
      tags:
      - Projects
      summary: 创建项目
      description: 任何已登录用户都可以创建项目，创建者自动成为 owner。
      operationId: create_project_api_admin_v1_projects_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Projects
      summary: 筛选和分页查询可访问项目
      description: 管理员查询全部项目；普通用户查询可见项目，并支持关键词、标签、状态和分页。
      operationId: list_projects_api_admin_v1_projects_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Query
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 20
          - type: 'null'
          title: Tag
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - inactive
            type: string
          - type: 'null'
          title: Status
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/tags:
    get:
      tags:
      - Projects
      summary: 查询可见项目的标签建议
      description: 返回当前用户可查看项目中的标签，供项目列表筛选。
      operationId: list_project_tags_api_admin_v1_projects_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Project Tags Api Admin V1 Projects Tags Get
      security:
      - HTTPBearer: []
  /api/admin/v1/projects/{project_id}:
    get:
      tags:
      - Projects
      summary: 查看项目
      operationId: get_project_api_admin_v1_projects__project_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: 更新项目
      operationId: update_project_api_admin_v1_projects__project_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Projects
      summary: 删除项目
      description: 永久删除项目及其标签、成员关系；仅项目 owner 可以删除。
      operationId: delete_project_api_admin_v1_projects__project_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/members:
    get:
      tags:
      - Projects
      summary: 查询项目成员
      operationId: list_members_api_admin_v1_projects__project_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
                title: Response List Members Api Admin V1 Projects  Project Id  Members
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Projects
      summary: 添加项目成员
      operationId: add_member_api_admin_v1_projects__project_id__members_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/members/{member_user_id}:
    delete:
      tags:
      - Projects
      summary: 移除项目成员
      operationId: remove_member_api_admin_v1_projects__project_id__members__member_user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: member_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Member User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: 修改项目成员角色
      operationId: update_member_role_api_admin_v1_projects__project_id__members__member_user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: member_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Member User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRoleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/keys:
    get:
      tags:
      - API Keys
      summary: 查询项目 API Key
      operationId: list_api_keys_api_admin_v1_projects__project_id__keys_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyResponse'
                title: Response List Api Keys Api Admin V1 Projects  Project Id  Keys
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - API Keys
      summary: 创建项目 API Key
      operationId: create_api_key_api_admin_v1_projects__project_id__keys_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/keys/{key_id}:
    delete:
      tags:
      - API Keys
      summary: 撤销项目 API Key
      operationId: revoke_api_key_api_admin_v1_projects__project_id__keys__key_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/services:
    get:
      tags:
      - Project Services
      summary: 列出服务目录和模型
      description: 提供当前可申请的服务目录及额度档位。
      operationId: list_service_catalog_api_admin_v1_services_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceCatalogResponse'
                type: array
                title: Response List Service Catalog Api Admin V1 Services Get
      security:
      - HTTPBearer: []
  /api/admin/v1/users/lookup:
    get:
      tags:
      - Project Services
      summary: 按用户名或用户 ID 查找额度目标
      description: 管理员按唯一用户名或 UUID 精确查找用户。
      operationId: lookup_quota_target_api_admin_v1_users_lookup_get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 目标用户 UUID；与 username 二选一。
          title: User Id
        description: 目标用户 UUID；与 username 二选一。
      - name: username
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 100
          - type: 'null'
          description: 目标用户的精确用户名。
          title: Username
        description: 目标用户的精确用户名。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaTargetResponse'
        '403':
          description: 需要管理员权限
        '404':
          description: 用户不存在
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/users/{user_id}/services:
    get:
      tags:
      - Project Services
      summary: 查看指定用户服务月额度
      description: 管理员查看指定用户的额度、项目分配及跨项目当月用量。
      operationId: get_user_service_quotas_api_admin_v1_users__user_id__services_get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserServiceQuotaResponse'
                title: Response Get User Service Quotas Api Admin V1 Users  User Id  Services
                  Get
        '403':
          description: 需要管理员权限
        '404':
          description: 用户不存在
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/users/{user_id}/services/{service_code}:
    put:
      tags:
      - Project Services
      summary: 设置用户服务月额度
      description: 管理员配置指定用户的服务级月额度。
      operationId: set_user_service_quota_api_admin_v1_users__user_id__services__service_code__put
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      - name: service_code
        in: path
        required: true
        schema:
          type: string
          title: Service Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserServiceQuotaRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserServiceQuotaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/services:
    get:
      tags:
      - Project Services
      summary: 查询项目已开通服务和用量
      description: 项目成员、公开项目 review 用户和管理员可以查看；管理员只读。
      operationId: list_project_services_api_admin_v1_projects__project_id__services_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectServiceResponse'
                title: Response List Project Services Api Admin V1 Projects  Project
                  Id  Services Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Project Services
      summary: 申请项目服务
      description: 项目 owner 提交申请后自动开通，无支付流程。
      operationId: apply_project_service_api_admin_v1_projects__project_id__services_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceApplicationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectServiceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/services/{service_code}:
    patch:
      tags:
      - Project Services
      summary: 调整项目服务额度
      description: 项目 owner 可调整项目额度；执行时校验个人可分配余额和当月已用量。
      operationId: update_project_service_allocation_api_admin_v1_projects__project_id__services__service_code__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: service_code
        in: path
        required: true
        schema:
          type: string
          title: Service Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectServiceAllocationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectServiceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/services:
    get:
      tags:
      - My Services
      summary: 查看我的服务和额度
      description: 返回服务目录中当前用户获授的额度、项目分配和当月用量。
      operationId: list_my_services_api_v1_me_services_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserServiceQuotaResponse'
                type: array
                title: Response List My Services Api V1 Me Services Get
      security:
      - HTTPBearer: []
  /v1/chat/completions:
    post:
      tags:
      - LLM Gateway
      summary: 调用 OpenAI 兼容 Chat Completions 网关
      description: 通过项目 API Key 自动解析项目并执行额度校验；请求正文不被保存。
      operationId: chat_completions_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/llm/models:
    get:
      tags:
      - LLM
      summary: 列出网关内置的 LLM 模型
      description: 返回网关内置模型；上游模型由调用方提供，无法从静态目录枚举。
      operationId: list_available_models_api_v1_llm_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Available Models Api V1 Llm Models Get
  /api/v1/llm/provider-catalog:
    get:
      tags:
      - LLM
      summary: 查看可用的 LLM 路由前缀
      description: 认证用户查看启用的路由组及供应商显示名，不返回敏感配置。
      operationId: get_public_provider_catalog_api_v1_llm_provider_catalog_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProviderCatalogResponse'
      security:
      - HTTPBearer: []
  /api/admin/v1/llm/providers:
    get:
      tags:
      - LLM Provider Management
      summary: 列出 LLM 供应商配置
      description: 管理员查看供应商 URL、连接优先级和密钥配置状态。
