openapi: 3.1.0
info:
  title: Agent Gateway API
  description: Agent 网关中台后端，提供账户、项目、服务管理和模型网关接口。
  version: 0.1.0
paths:
  /health/live:
    get:
      tags:
      - Health
      summary: 检查应用进程是否可响应
      description: 返回进程存活状态，不访问外部依赖。
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags:
      - Health
      summary: 检查应用是否可接收依赖数据库的请求
      description: 验证数据库可用性，并将底层异常转换为安全的稳定错误。
      operationId: readiness_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: 注册普通用户
      description: 创建普通用户，注册接口不会创建管理员。
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: 用户名已存在
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: 用户登录
      description: 验证用户凭据并签发包含角色的短期 Bearer 令牌。
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 用户退出
      description: 撤销当前令牌；客户端也应清理本地令牌。
      operationId: logout_api_v1_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: 令牌无效或缺失
      security:
      - HTTPBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: 获取当前用户
      description: 返回当前登录用户的非敏感信息。
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: 令牌无效或缺失
      security:
      - HTTPBearer: []
  /api/admin/v1/projects:
    post:
      tags:
      - Projects
      summary: 创建项目
      description: 任何已登录用户都可以创建项目，创建者自动成为 owner。
      operationId: create_project_api_admin_v1_projects_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Projects
      summary: 筛选和分页查询可访问项目
      description: 管理员查询全部项目；普通用户查询可见项目，并支持关键词、标签、状态和分页。
      operationId: list_projects_api_admin_v1_projects_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Query
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 20
          - type: 'null'
          title: Tag
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - inactive
            type: string
          - type: 'null'
          title: Status
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/tags:
    get:
      tags:
      - Projects
      summary: 查询可见项目的标签建议
      description: 返回当前用户可查看项目中的标签，供项目列表筛选。
      operationId: list_project_tags_api_admin_v1_projects_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Project Tags Api Admin V1 Projects Tags Get
      security:
      - HTTPBearer: []
  /api/admin/v1/projects/{project_id}:
    get:
      tags:
      - Projects
      summary: 查看项目
      operationId: get_project_api_admin_v1_projects__project_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: 更新项目
      operationId: update_project_api_admin_v1_projects__project_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Projects
      summary: 删除项目
      description: 永久删除项目及其标签、成员关系；仅项目 owner 可以删除。
      operationId: delete_project_api_admin_v1_projects__project_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/members:
    get:
      tags:
      - Projects
      summary: 查询项目成员
      operationId: list_members_api_admin_v1_projects__project_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberResponse'
                title: Response List Members Api Admin V1 Projects  Project Id  Members
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Projects
      summary: 添加项目成员
      operationId: add_member_api_admin_v1_projects__project_id__members_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/members/{member_user_id}:
    delete:
      tags:
      - Projects
      summary: 移除项目成员
      operationId: remove_member_api_admin_v1_projects__project_id__members__member_user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: member_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Member User Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Projects
      summary: 修改项目成员角色
      operationId: update_member_role_api_admin_v1_projects__project_id__members__member_user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: member_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Member User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectMemberRoleUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/keys:
    get:
      tags:
      - API Keys
      summary: 查询项目 API Key
      operationId: list_api_keys_api_admin_v1_projects__project_id__keys_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyResponse'
                title: Response List Api Keys Api Admin V1 Projects  Project Id  Keys
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - API Keys
      summary: 创建项目 API Key
      operationId: create_api_key_api_admin_v1_projects__project_id__keys_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/keys/{key_id}:
    delete:
      tags:
      - API Keys
      summary: 撤销项目 API Key
      operationId: revoke_api_key_api_admin_v1_projects__project_id__keys__key_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/services:
    get:
      tags:
      - Project Services
      summary: 列出服务目录和模型
      description: 提供当前可申请的服务目录及额度档位。
      operationId: list_service_catalog_api_admin_v1_services_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceCatalogResponse'
                type: array
                title: Response List Service Catalog Api Admin V1 Services Get
      security:
      - HTTPBearer: []
  /api/admin/v1/users/lookup:
    get:
      tags:
      - Project Services
      summary: 按用户名或用户 ID 查找额度目标
      description: 管理员按唯一用户名或 UUID 精确查找用户。
      operationId: lookup_quota_target_api_admin_v1_users_lookup_get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 目标用户 UUID；与 username 二选一。
          title: User Id
        description: 目标用户 UUID；与 username 二选一。
      - name: username
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 100
          - type: 'null'
          description: 目标用户的精确用户名。
          title: Username
        description: 目标用户的精确用户名。
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaTargetResponse'
        '403':
          description: 需要管理员权限
        '404':
          description: 用户不存在
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/users/{user_id}/services:
    get:
      tags:
      - Project Services
      summary: 查看指定用户服务月额度
      description: 管理员查看指定用户的额度、项目分配及跨项目当月用量。
      operationId: get_user_service_quotas_api_admin_v1_users__user_id__services_get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserServiceQuotaResponse'
                title: Response Get User Service Quotas Api Admin V1 Users  User Id  Services
                  Get
        '403':
          description: 需要管理员权限
        '404':
          description: 用户不存在
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/users/{user_id}/services/{service_code}:
    put:
      tags:
      - Project Services
      summary: 设置用户服务月额度
      description: 管理员配置指定用户的服务级月额度。
      operationId: set_user_service_quota_api_admin_v1_users__user_id__services__service_code__put
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      - name: service_code
        in: path
        required: true
        schema:
          type: string
          title: Service Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserServiceQuotaRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserServiceQuotaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/services:
    get:
      tags:
      - Project Services
      summary: 查询项目已开通服务和用量
      description: 项目成员、公开项目 review 用户和管理员可以查看；管理员只读。
      operationId: list_project_services_api_admin_v1_projects__project_id__services_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectServiceResponse'
                title: Response List Project Services Api Admin V1 Projects  Project
                  Id  Services Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Project Services
      summary: 申请项目服务
      description: 项目 owner 提交申请后自动开通，无支付流程。
      operationId: apply_project_service_api_admin_v1_projects__project_id__services_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceApplicationRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectServiceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/projects/{project_id}/services/{service_code}:
    patch:
      tags:
      - Project Services
      summary: 调整项目服务额度
      description: 项目 owner 可调整项目额度；执行时校验个人可分配余额和当月已用量。
      operationId: update_project_service_allocation_api_admin_v1_projects__project_id__services__service_code__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: service_code
        in: path
        required: true
        schema:
          type: string
          title: Service Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectServiceAllocationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectServiceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me/services:
    get:
      tags:
      - My Services
      summary: 查看我的服务和额度
      description: 返回服务目录中当前用户获授的额度、项目分配和当月用量。
      operationId: list_my_services_api_v1_me_services_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserServiceQuotaResponse'
                type: array
                title: Response List My Services Api V1 Me Services Get
      security:
      - HTTPBearer: []
  /v1/chat/completions:
    post:
      tags:
      - LLM Gateway
      summary: 调用 LLM Mock Chat Completions
      description: 通过项目 API Key 自动解析项目并执行额度校验；请求正文不被保存。
      operationId: chat_completions_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/llm/models:
    get:
      tags:
      - LLM
      summary: 列出可调用的 LLM 模型
      description: 返回可传入 Chat Completions 的公开模型名，不含供应商信息。
      operationId: list_available_models_api_v1_llm_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response List Available Models Api V1 Llm Models Get
  /api/admin/v1/llm/providers:
    get:
      tags:
      - LLM Provider Management
      summary: 列出 LLM 供应商配置
      description: 管理员查看供应商 URL、密钥配置状态和模型映射。
      operationId: list_providers_api_admin_v1_llm_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProviderResponse'
                type: array
                title: Response List Providers Api Admin V1 Llm Providers Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - LLM Provider Management
      summary: 创建 LLM 供应商
      description: 创建 OpenAI 兼容供应商，并在服务端加密保存 API Key。
      operationId: create_provider_api_admin_v1_llm_providers_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/admin/v1/llm/providers/{provider_id}:
    patch:
      tags:
      - LLM Provider Management
      summary: 修改 LLM 供应商
      description: 更新连接参数；提交新 API Key 时轮换，留空保持原密钥。
      operationId: update_provider_api_admin_v1_llm_providers__provider_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Provider Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - LLM Provider Management
      summary: 删除 LLM 供应商
      description: 删除供应商及其模型映射。
      operationId: delete_provider_api_admin_v1_llm_providers__provider_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Provider Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/llm/providers/{provider_id}/test:
    post:
      tags:
      - LLM Provider Management
      summary: 测试 LLM 供应商连通性
      description: 使用该连接的首个已启用模型发送最小 Chat Completions 请求；至少需要一个启用的模型映射。不返回原始响应或密钥。
      operationId: test_provider_api_admin_v1_llm_providers__provider_id__test_post
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Provider Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderTestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/llm/providers/{provider_id}/models:
    post:
      tags:
      - LLM Provider Management
      summary: 为供应商添加模型
      description: 添加网关公开名称与供应商上游模型名的映射。
      operationId: create_model_api_admin_v1_llm_providers__provider_id__models_post
      security:
      - HTTPBearer: []
      parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Provider Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/v1/llm/models/{model_id}:
    patch:
      tags:
      - LLM Provider Management
      summary: 修改 LLM 模型映射
      description: 修改对外名称、上游模型名或启用状态。
      operationId: update_model_api_admin_v1_llm_models__model_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Model Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - LLM Provider Management
      summary: 删除 LLM 模型映射
      description: 删除模型映射。
      operationId: delete_model_api_admin_v1_llm_models__model_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Model Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ApiKeyCreateRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: 省略表示永不过期。
      type: object
      required:
      - name
      title: ApiKeyCreateRequest
    ApiKeyCreatedResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        key_prefix:
          type: string
          title: Key Prefix
        key_last_four:
          type: string
          title: Key Last Four
        secret:
          type: string
          title: Secret
          description: 完整 Key；项目 owner/editor 之后仍可查看。
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
          title: Status
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - project_id
      - name
      - key_prefix
      - key_last_four
      - secret
      - status
      - expires_at
      - last_used_at
      - revoked_at
      - created_at
      title: ApiKeyCreatedResponse
    ApiKeyResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        key_prefix:
          type: string
          title: Key Prefix
        key_last_four:
          type: string
          title: Key Last Four
        secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret
          description: 完整 Key；仅 owner/editor 可查看，旧版无法恢复的 Key 为 null。
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
          title: Status
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - project_id
      - name
      - key_prefix
      - key_last_four
      - secret
      - status
      - expires_at
      - last_used_at
      - revoked_at
      - created_at
      title: ApiKeyResponse
    ChatCompletionRequest:
      properties:
        model:
          type: string
          title: Model
          description: 服务模型标识，例如 mock-chat。
        messages:
          items:
            $ref: '#/components/schemas/ChatMessageRequest'
          type: array
          maxItems: 100
          minItems: 1
          title: Messages
        max_tokens:
          type: integer
          maximum: 4096.0
          minimum: 1.0
          title: Max Tokens
          description: 本请求生成上限，也用于额度预留。
          default: 256
        stream:
          type: boolean
          title: Stream
          description: 是否以 Server-Sent Events 返回。
          default: false
        stream_options:
          anyOf:
          - additionalProperties:
              type: boolean
            type: object
          - type: 'null'
          title: Stream Options
          description: 兼容 OpenAI 的 stream_options；支持 include_usage。
      type: object
      required:
      - model
      - messages
      title: ChatCompletionRequest
      description: LLM Mock 聊天请求。
    ChatMessageRequest:
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          title: Role
          description: 消息角色。
        content:
          type: string
          maxLength: 100000
          minLength: 1
          title: Content
          description: 文本内容；服务端不持久化正文。
      type: object
      required:
      - role
      - content
      title: ChatMessageRequest
      description: 兼容 OpenAI chat completions 的单条文本消息。
    CreateModelRequest:
      properties:
        model_code:
          type: string
          maxLength: 100
          minLength: 1
          title: Model Code
          description: 网关调用方使用的模型标识。
        upstream_model:
          type: string
          maxLength: 200
          minLength: 1
          title: Upstream Model
          description: 供应商定义的模型标识。
      type: object
      required:
      - model_code
      - upstream_model
      title: CreateModelRequest
    CreateProviderRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: 管理员自定义的供应商名称。
        base_url:
          type: string
          maxLength: 500
          title: Base Url
          description: OpenAI 兼容 API Base URL，通常以 /v1 结尾。
        api_key:
          type: string
          maxLength: 4000
          minLength: 1
          title: Api Key
          description: 上游供应商 API Key，仅写入。
      type: object
      required:
      - name
      - base_url
      - api_key
      title: CreateProviderRequest
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
          description: 供调用方稳定判断的错误码。
        message:
          type: string
          title: Message
          description: 可安全展示的错误消息。
        request_id:
          type: string
          title: Request Id
          description: 用于关联服务端日志的请求标识。
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorResponse
      description: 不暴露底层异常的公共错误响应。
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
          description: 当前探针状态。
      type: object
      required:
      - status
      title: HealthResponse
      description: 健康检查成功响应。
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 100
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 256
          minLength: 1
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
      description: 统一用户登录请求。
    ModelResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        model_code:
          type: string
          title: Model Code
          description: 调用方传给网关的公开模型名。
        upstream_model:
          type: string
          title: Upstream Model
          description: 发送给第三方供应商的模型名。
        status:
          type: string
          enum:
          - active
          - disabled
          title: Status
      type: object
      required:
      - id
      - model_code
      - upstream_model
      - status
      title: ModelResponse
      description: 网关公开模型及上游模型映射。
    ProjectCreateRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        visibility:
          type: string
          enum:
          - public
          - private
          title: Visibility
          default: private
        tags:
          items:
            type: string
            maxLength: 20
            minLength: 1
          type: array
          maxItems: 5
          title: Tags
      type: object
      required:
      - name
      title: ProjectCreateRequest
    ProjectListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProjectResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        offset:
          type: integer
          title: Offset
        limit:
          type: integer
          title: Limit
      type: object
      required:
      - items
      - total
      - offset
      - limit
      title: ProjectListResponse
    ProjectMemberRequest:
      properties:
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
          description: 目标用户 UUID；与 username 二选一。
        username:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 3
          - type: 'null'
          title: Username
          description: 目标用户的唯一用户名；与 user_id 二选一。
        role:
          type: string
          enum:
          - editor
          - viewer
          title: Role
          description: 授予用户的项目成员角色。
      type: object
      required:
      - role
      title: ProjectMemberRequest
    ProjectMemberResponse:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
          description: 项目 UUID。
        user_id:
          type: string
          format: uuid
          title: User Id
          description: 成员用户 UUID，可用于移除成员等后续操作。
        username:
          type: string
          title: Username
          description: 成员的唯一用户名。
        role:
          type: string
          enum:
          - owner
          - editor
          - viewer
          title: Role
          description: 成员在该项目中的角色。
        created_at:
          type: string
          format: date-time
          title: Created At
          description: 成员关系创建时间。
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: 成员关系最近更新时间。
      type: object
      required:
      - project_id
      - user_id
      - username
      - role
      - created_at
      - updated_at
      title: ProjectMemberResponse
    ProjectMemberRoleUpdateRequest:
      properties:
        role:
          type: string
          enum:
          - editor
          - viewer
          title: Role
          description: 修改后的项目成员角色。
      type: object
      required:
      - role
      title: ProjectMemberRoleUpdateRequest
    ProjectResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        status:
          type: string
          enum:
          - active
          - inactive
          title: Status
        visibility:
          type: string
          enum:
          - public
          - private
          title: Visibility
        tags:
          items:
            type: string
          type: array
          title: Tags
        owner_id:
          type: string
          format: uuid
          title: Owner Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - name
      - description
      - status
      - visibility
      - tags
      - owner_id
      - created_at
      - updated_at
      title: ProjectResponse
    ProjectServiceAllocationRequest:
      properties:
        monthly_token_limit:
          type: integer
          minimum: 1.0
          title: Monthly Token Limit
          description: 新的项目月度 token 上限；不能低于当月已用量或超出 owner 个人上限。
      type: object
      required:
      - monthly_token_limit
      title: ProjectServiceAllocationRequest
    ProjectServiceResponse:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
          description: 订阅所属项目；调用方无需把该 ID 传给模型网关。
        service_code:
          type: string
          title: Service Code
          description: 服务目录代码。
        monthly_token_limit:
          type: integer
          title: Monthly Token Limit
          description: 每月 token 上限。
        status:
          type: string
          enum:
          - active
          - suspended
          title: Status
          description: 服务订阅状态。
        period_start:
          type: string
          title: Period Start
          description: 当前用量周期起始日，UTC 月初。
        tokens_used:
          type: integer
          title: Tokens Used
          description: 本周期已确认消耗。
        tokens_reserved:
          type: integer
          title: Tokens Reserved
          description: 并发请求预留中 token。
      type: object
      required:
      - project_id
      - service_code
      - monthly_token_limit
      - status
      - period_start
      - tokens_used
      - tokens_reserved
      title: ProjectServiceResponse
      description: 项目的有效服务订阅及当前 UTC 月用量。
    ProjectUpdateRequest:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        status:
          anyOf:
          - type: string
            enum:
            - active
            - inactive
          - type: 'null'
          title: Status
        visibility:
          anyOf:
          - type: string
            enum:
            - public
            - private
          - type: 'null'
          title: Visibility
        tags:
          anyOf:
          - items:
              type: string
              maxLength: 20
              minLength: 1
            type: array
            maxItems: 5
          - type: 'null'
          title: Tags
      type: object
      title: ProjectUpdateRequest
    ProviderResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        base_url:
          type: string
          title: Base Url
        status:
          type: string
          enum:
          - active
          - disabled
          title: Status
        api_key_configured:
          type: boolean
          title: Api Key Configured
        last_tested_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Tested At
        last_test_success:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Last Test Success
        last_test_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Test Message
        models:
          items:
            $ref: '#/components/schemas/ModelResponse'
          type: array
          title: Models
      type: object
      required:
      - id
      - name
      - base_url
      - status
      - api_key_configured
      - last_tested_at
      - last_test_success
      - last_test_message
      - models
      title: ProviderResponse
      description: 供应商可公开配置；永不包含其 API Key 或密文。
    ProviderTestResponse:
      properties:
        success:
          type: boolean
          title: Success
        message:
          type: string
          title: Message
        tested_at:
          type: string
          title: Tested At
      type: object
      required:
      - success
      - message
      - tested_at
      title: ProviderTestResponse
      description: 供应商连通性测试结果。
    QuotaTargetResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: 目标用户 ID。
        username:
          type: string
          title: Username
          description: 唯一用户名。
        role:
          type: string
          enum:
          - admin
          - user
          title: Role
          description: 当前平台角色。
      type: object
      required:
      - id
      - username
      - role
      title: QuotaTargetResponse
      description: 最少字段的用户识别结果，禁止返回账户凭据。
    RegisterRequest:
      properties:
        username:
          type: string
          maxLength: 100
          minLength: 3
          title: Username
        password:
          type: string
          maxLength: 256
          minLength: 8
          title: Password
      type: object
      required:
      - username
      - password
      title: RegisterRequest
      description: 普通用户注册请求。
    ServiceApplicationRequest:
      properties:
        service_code:
          type: string
          title: Service Code
          description: 要申请的服务目录代码。
        monthly_token_limit:
          type: integer
          minimum: 1.0
          title: Monthly Token Limit
          description: 分配给本项目的月度 token 上限；不能超过 owner 的个人可分配额度。
      type: object
      required:
      - service_code
      - monthly_token_limit
      title: ServiceApplicationRequest
    ServiceCatalogResponse:
      properties:
        code:
          type: string
          title: Code
          description: 稳定服务代码。
        name:
          type: string
          title: Name
          description: 服务展示名称。
        models:
          items:
            type: string
          type: array
          title: Models
          description: 此服务包含的模型标识。
      type: object
      required:
      - code
      - name
      - models
      title: ServiceCatalogResponse
      description: 目前可申请的服务目录项。
    SetUserServiceQuotaRequest:
      properties:
        monthly_token_limit:
          type: integer
          minimum: 0.0
          title: Monthly Token Limit
          description: 用户每月服务总上限；允许低于项目分配总额，0 会暂停调用且保留项目分配记录。
      type: object
      required:
      - monthly_token_limit
      title: SetUserServiceQuotaRequest
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
