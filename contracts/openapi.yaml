openapi: 3.1.0
info:
  title: Agent Gateway API
  version: 0.1.0
  description: 统一认证、项目管理、成员授权和健康检查接口契约。
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: 检查应用进程是否可响应
      tags: [Health]
      responses:
        "200":
          description: 应用进程可响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: 检查应用是否可接收依赖数据库的请求
      description: 执行最小数据库查询；失败响应不包含连接串或底层异常文本。
      tags: [Health]
      responses:
        "200":
          description: 数据库连接正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 数据库当前不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 用户登录
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 用户名或密码错误
  /api/v1/auth/register:
    post:
      operationId: register
      summary: 注册普通用户
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: 用户名已存在
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 用户退出
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 当前令牌已撤销
        "401":
          description: 令牌无效或缺失
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: 获取当前用户
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前管理员公开信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: 令牌无效或缺失
  /api/admin/v1/projects:
    post:
      operationId: create_project
      summary: 创建项目
      description: 任何已认证用户均可创建；创建者成为 owner，默认项目为私有。
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    get:
      operationId: list_projects
      summary: 查询可访问项目
      description: 管理员可 review 所有项目；普通用户可查看公开项目及私有成员项目。
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          schema: { type: string, maxLength: 100 }
          description: 按项目名称或描述模糊搜索。
        - in: query
          name: tag
          schema: { type: string, minLength: 1, maxLength: 20 }
          description: 精确匹配一个标签。
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive] }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
  /api/admin/v1/projects/tags:
    get:
      operationId: list_project_tags
      summary: 查询可见项目的标签建议
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 标签列表
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /api/admin/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: get_project
      summary: 查看项目
      description: 管理员可 review 所有项目；公开项目对所有已认证用户可读，私有项目仅对成员可读。
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    patch:
      operationId: update_project
      summary: 更新项目
      description: 仅项目 owner 可以更新；管理员的跨项目权限为只读 review。
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    delete:
      operationId: delete_project
      summary: 删除项目
      description: 仅项目 owner 可以永久删除；标签和成员关系会随项目一并删除。
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 删除成功
        "403":
          description: 当前用户不是项目 owner
        "404":
          description: 项目不存在
  /api/admin/v1/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: list_members
      summary: 查询项目成员
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 项目成员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMemberResponse"
    post:
      operationId: add_member
      summary: 添加项目成员
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberRequest"
      responses:
        "201":
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
  /api/admin/v1/projects/{project_id}/members/{member_user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: member_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: remove_member
      summary: 移除项目成员
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 移除成功
    patch:
      operationId: update_project_member_role
      summary: 修改项目成员角色
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberRoleUpdateRequest"
      responses:
        "200":
          description: 角色修改成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
  /api/admin/v1/projects/{project_id}/keys:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: list_api_keys
      summary: 查询项目 API Key
      description: owner 和 editor 可查询完整 Key；数据库保存加密密文，响应不返回摘要。
      tags: [API Keys]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Key 元数据列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKeyResponse" }
        "403": { description: 当前用户不是项目 owner }
        "404": { description: 项目不存在 }
        "503": { description: 未配置 API_KEY_SECRET_KEY }
    post:
      operationId: create_api_key
      summary: 创建项目 API Key
      description: 仅项目 owner 可创建；每个 Key 默认具有整个项目的调用权限。
      tags: [API Keys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreateRequest" }
      responses:
        "201":
          description: 已创建；请立即安全保存 secret。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreatedResponse" }
        "403": { description: 当前用户不是项目 owner }
        "404": { description: 项目不存在 }
        "422": { description: Key 名称或有效期无效 }
        "503": { description: 未配置 API_KEY_SECRET_KEY }
  /api/admin/v1/projects/{project_id}/keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: key_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revoke_api_key
      summary: 撤销项目 API Key
      tags: [API Keys]
      security:
        - bearerAuth: []
      responses:
        "204": { description: 已撤销 }
        "403": { description: 当前用户不是项目 owner }
        "404": { description: 项目或 Key 不存在 }
        "503": { description: 未配置 API_KEY_SECRET_KEY }
  /api/admin/v1/services:
    get:
      operationId: list_service_catalog
      summary: 查询服务目录和模型
      description: 目前只提供 LLM Mock 服务；每个用户可用的月额度由个人服务接口返回。
      tags: [Project Services]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 可申请的服务及其模型列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceCatalogResponse" }
  /api/admin/v1/projects/{project_id}/services:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: list_project_services
      summary: 查询项目已开通服务和用量
      description: 项目成员、公开项目 review 用户和管理员可读；用量周期按 UTC 自然月计算。
      tags: [Project Services]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 项目服务订阅及当前月已用、预留 token
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectServiceResponse" }
        "403": { description: 无权 review 此项目 }
        "404": { description: 项目不存在 }
    post:
      operationId: apply_project_service
      summary: 申请项目服务
      description: 仅项目 owner 可申请；额度从 owner 的用户级上限中分配，自动开通且无支付或人工审批。
      tags: [Project Services]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServiceApplicationRequest" }
      responses:
        "201":
          description: 已开通服务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectServiceResponse" }
        "403": { description: 只有项目 owner 可以申请 }
        "404": { description: 项目或服务不存在 }
        "409": { description: 重复申请或用户额度不足以容纳该项目分配 }
  /api/admin/v1/projects/{project_id}/services/{service_code}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: service_code
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: upgrade_project_service
      summary: 调整项目服务额度
      description: 仅项目 owner 可调整项目额度；所有本人项目分配总和不能超过用户上限，额度不能低于当月项目已用和预留 token。
      tags: [Project Services]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectServiceAllocationRequest" }
      responses:
        "200":
          description: 已调整项目月度额度
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectServiceResponse" }
        "403": { description: 只有项目 owner 可以升级 }
        "404": { description: 服务订阅不存在 }
        "409": { description: 用户额度不足或项目额度不能低于当月已用量 }
  /api/admin/v1/users/{user_id}/services/{service_code}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: service_code
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: set_user_service_quota
      summary: 设置用户服务月额度
      description: 仅管理员可设置；新注册用户使用配置的默认额度。允许上限低于项目分配总额，项目分配记录保留但调用受用户总上限约束；设为 0 会暂停该用户此服务的调用。
      tags: [Project Services]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetUserServiceQuotaRequest" }
      responses:
        "200":
          description: 更新后的用户服务额度
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserServiceQuotaResponse" }
        "403": { description: 需要管理员权限 }
        "404": { description: 用户或服务不存在 }
  /api/admin/v1/users/lookup:
    get:
      operationId: lookup_user_for_quota_management
      summary: 按用户名或用户 ID 查找额度目标
      description: 仅管理员可用；用户名必须精确匹配。user_id 与 username 必须且只能提供一个。
      tags: [Project Services]
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: query
          required: false
          description: 目标用户 UUID，与 username 二选一。
          schema: { type: string, format: uuid }
        - name: username
          in: query
          required: false
          description: 目标用户唯一用户名，精确匹配。
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: 已找到目标用户的非敏感标识
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuotaTargetResponse" }
        "403": { description: 需要管理员权限 }
        "404": { description: 用户不存在 }
        "422": { description: 必须且只能提供一个查询条件 }
  /api/admin/v1/users/{user_id}/services:
    get:
      operationId: get_user_service_quotas
      summary: 查看指定用户服务月额度
      description: 仅管理员可用；返回目标用户的服务总上限、项目分配、可分配余额和当月用量。
      tags: [Project Services]
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: 目标用户服务额度列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserServiceQuotaResponse" }
        "403": { description: 需要管理员权限 }
        "404": { description: 用户不存在 }
  /api/v1/me/services:
    get:
      operationId: list_my_services
      summary: 查看我的服务能力和额度
      description: 当前登录用户可查看服务目录中的额度、项目分配合计、可分配额度和跨项目当月用量。
      tags: [My Services]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 个人服务能力列表；当前仅返回 LLM Mock 服务
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserServiceQuotaResponse" }
        "401": { description: 访问令牌缺失或无效 }
  /v1/chat/completions:
    post:
      operationId: create_chat_completion
      summary: 调用 LLM Mock 聊天模型
      description: 使用项目 API Key 作为 Bearer 凭证；项目由 Key 自动解析，无需传 project_id。支持 JSON 与 SSE，按 UTC 自然月扣除项目服务额度。消息和回复正文不会持久化。
      tags: [LLM Gateway]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: "模型回复；stream=true 时返回 Server-Sent Events，终止事件为 data: [DONE]"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletionResponse" }
            text/event-stream:
              schema: { type: string, description: OpenAI-compatible SSE chunks. }
        "401": { description: API Key 缺失、无效、撤销或过期 }
        "403": { description: 项目尚未开通 LLM Mock 服务 }
        "404": { description: 模型不存在 }
        "429": { description: 项目分配额度或用户跨项目总额度不足 }
        "502": { description: Provider 调用失败 }
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: 当前探针状态。
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: database_unavailable
          description: 供调用方稳定判断的错误码。
        message:
          type: string
          description: 可安全展示且不含底层敏感信息的消息。
        request_id:
          type: string
          description: 用于关联服务端日志的请求标识。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: 令牌有效期，单位为秒。
    UserResponse:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        visibility:
          type: string
          enum: [public, private]
          default: private
          description: 项目可见范围，默认私有。
        tags:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 自定义标签；服务端会去空格、转小写并去重，每项最多 20 个字符。
          items: { type: string, minLength: 1, maxLength: 20 }
    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          anyOf:
            - type: string
              enum: [active, inactive]
            - type: 'null'
        visibility:
          anyOf:
            - type: string
              enum: [public, private]
            - type: 'null'
          description: 项目可见范围；仅 owner 可修改。
        tags:
          type: array
          maxItems: 5
          uniqueItems: true
          description: 更新项目标签；传空数组可清空。
          items: { type: string, minLength: 1, maxLength: 20 }
    ProjectListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ProjectResponse" }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    ProjectResponse:
      type: object
      required: [id, name, description, status, visibility, tags, owner_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, inactive]
        visibility:
          type: string
          enum: [public, private]
          description: public 对所有已认证用户只读开放；private 仅对 owner、成员及管理员可查看。
        tags:
          type: array
          items: { type: string }
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectMemberRequest:
      type: object
      required: [role]
      description: user_id 和 username 必须且只能提供一个，用于唯一定位目标用户。
      properties:
        user_id:
          type: [string, 'null']
          format: uuid
          description: 用户 UUID；与 username 二选一。
        username:
          type: [string, 'null']
          minLength: 3
          maxLength: 100
          description: 唯一用户名；与 user_id 二选一。
        role:
          type: string
          enum: [editor, viewer]
          description: 加入项目后的成员角色。
    ProjectMemberResponse:
      type: object
      required: [project_id, user_id, username, role, created_at, updated_at]
      properties:
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          description: 成员用户 UUID，可用于后续成员操作。
        username:
          type: string
          description: 成员唯一用户名。
        role:
          type: string
          enum: [owner, editor, viewer]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectMemberRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [editor, viewer]
          description: 成员的新角色；owner 角色不能通过此接口变更。
    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        expires_at:
          type: [string, 'null']
          format: date-time
          description: 省略或 null 表示永不过期。
    ApiKeyResponse:
      type: object
      required: [id, project_id, name, key_prefix, key_last_four, secret, status, expires_at, last_used_at, revoked_at, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, description: 用于检索和识别的 Key 前缀。 }
        key_last_four: { type: string, minLength: 4, maxLength: 4 }
        secret:
          type: [string, 'null']
          description: owner/editor 可见的完整 Key；旧版无法恢复的密钥为 null。
        status: { type: string, enum: [active, revoked, expired] }
        expires_at: { type: [string, 'null'], format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    ApiKeyCreatedResponse:
      allOf:
        - $ref: "#/components/schemas/ApiKeyResponse"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              writeOnly: true
              description: 完整 Key；owner/editor 可随时查看，数据库只保存加密密文。
    ServiceCatalogResponse:
      type: object
      required: [code, name, models]
      properties:
        code: { type: string, example: mock-llm-v1, description: 稳定服务代码。 }
        name: { type: string, description: 服务展示名称。 }
        models:
          type: array
          items: { type: string }
    ServiceApplicationRequest:
      type: object
      required: [service_code, monthly_token_limit]
      properties:
        service_code: { type: string, example: mock-llm-v1 }
        monthly_token_limit: { type: integer, minimum: 1, description: 分配给项目的月 token 上限；不得超过用户可分配额度。 }
    ProjectServiceAllocationRequest:
      type: object
      required: [monthly_token_limit]
      properties:
        monthly_token_limit: { type: integer, minimum: 1, description: 新项目月度分配；不能低于当月已用与预留量。 }
    ProjectServiceResponse:
      type: object
      required: [project_id, service_code, monthly_token_limit, status, period_start, tokens_used, tokens_reserved]
      properties:
        project_id: { type: string, format: uuid }
        service_code: { type: string }
        monthly_token_limit: { type: integer }
        status: { type: string, enum: [active, suspended] }
        period_start: { type: string, format: date, description: 当前 UTC 月度用量周期起点。 }
        tokens_used: { type: integer, description: 本周期已确认消耗。 }
        tokens_reserved: { type: integer, description: 处理中请求的预留额度。 }
    SetUserServiceQuotaRequest:
      type: object
      required: [monthly_token_limit]
      properties:
        monthly_token_limit: { type: integer, minimum: 0, description: 用户每月服务总上限；允许低于项目分配总额，0 会暂停调用且保留项目分配记录。 }
    QuotaTargetResponse:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string, format: uuid, description: 目标用户 ID。 }
        username: { type: string, description: 唯一用户名。 }
        role: { type: string, enum: [admin, user], description: 当前平台角色。 }
    UserServiceQuotaResponse:
      type: object
      required: [service_code, name, models, monthly_token_limit, allocated_tokens, available_tokens, tokens_used, tokens_reserved]
      properties:
        service_code: { type: string, description: 当前服务代码。 }
        name: { type: string, description: 服务展示名称。 }
        models: { type: array, items: { type: string } }
        monthly_token_limit: { type: integer, description: 管理员授予的用户月度上限；0 表示服务调用已暂停。 }
        allocated_tokens: { type: integer, description: 已分配给该用户所有项目的额度总和；管理员可将用户上限调到此值以下。 }
        available_tokens: { type: integer, description: 可继续分配给项目的余额；若项目分配已超过用户上限则为 0。 }
        tokens_used: { type: integer, description: 该用户所有项目本月已确认消耗。 }
        tokens_reserved: { type: integer, description: 该用户所有项目本月预留 token。 }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, example: mock-chat }
        messages:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ChatMessage" }
        max_tokens: { type: integer, minimum: 1, maximum: 4096, default: 256, description: 每次生成上限并用于预留额度。 }
        stream: { type: boolean, default: false }
        stream_options:
          type: object
          properties:
            include_usage: { type: boolean, description: 在最后一个 SSE chunk 附带 token 用量。 }
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string, minLength: 1, maxLength: 100000, description: 正文仅用于本次请求，不写入调用日志。 }
    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices, usage]
      properties:
        id: { type: string, description: 请求追踪 ID。 }
        object: { type: string, enum: [chat.completion] }
        created: { type: integer, description: Unix 时间戳。 }
        model: { type: string }
        choices: { type: array, items: { type: object } }
        usage: { type: object, description: prompt/completion/total token 数。 }
