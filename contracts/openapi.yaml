  /v1/vector-stores/collections/{collection}/upsert:
    post:
      tags:
      - Vector Database
      summary: 批量写入普通记录和向量记录
      description: vectors 每批最多 64 条、请求体最多 4 MiB。record_kind=vector 对预切片文本或媒体生成 Embedding；record_kind=document
        只存正文和 metadata，正文最多 20,000 个 Unicode 码位并跳过 Embedding。向量文本不超过 collection.chunk_size。ID
        在项目+collection 内唯一，同类型重复提交幂等替换；vector/document 类型不可互转。父记录须先单独写入，且必须是同项目、同
        collection 的 document。Embedding 成功后，记录在一个数据库事务中替换；外部 Embedding 用量不可随事务回滚。提供
        namespace、document_id、version_id 时必须设 staged=true，并调用 publish 后才可见。响应 id 保留为内部
        UUID；external_id 才是调用方 ID，后续 fetch、delete 和 parent_id 均使用它。省略 record_kind
        时默认为 vector，旧客户端也可继续传 documents 字段。
      operationId: upsert_vectors_v1_vector_stores_collections__collection__upsert_post
      security:
      - HTTPBearer: []
      parameters:
      - name: collection
        in: path
        required: true
        schema:
          type: string
          title: Collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Upsert Vectors V1 Vector Stores Collections  Collection  Upsert
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
