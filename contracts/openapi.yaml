components:
  schemas:
    ApiKeyCreateRequest:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: 省略表示永不过期。
      type: object
      required:
      - name
      title: ApiKeyCreateRequest
    ApiKeyCreatedResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        key_prefix:
          type: string
          title: Key Prefix
        key_last_four:
          type: string
          title: Key Last Four
        secret:
          type: string
          title: Secret
          description: 完整 Key；项目 owner/editor 之后仍可查看。
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
          title: Status
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - project_id
      - name
      - key_prefix
      - key_last_four
      - secret
      - status
      - expires_at
      - last_used_at
      - revoked_at
      - created_at
      title: ApiKeyCreatedResponse
    ApiKeyResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        key_prefix:
          type: string
          title: Key Prefix
        key_last_four:
          type: string
          title: Key Last Four
        secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret
          description: 完整 Key；仅 owner/editor 可查看，旧版无法恢复的 Key 为 null。
        status:
          type: string
          enum:
          - active
          - revoked
          - expired
          title: Status
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - project_id
      - name
      - key_prefix
      - key_last_four
      - secret
      - status
      - expires_at
      - last_used_at
      - revoked_at
      - created_at
      title: ApiKeyResponse
    ChatCompletionRequest:
      properties:
        model:
          type: string
          maxLength: 200
          minLength: 1
          title: Model
          description: 模型标识；供应商连接原样接收此名称，必须填写供应商支持的模型名。
        messages:
          items:
            $ref: '#/components/schemas/ChatMessageRequest'
          type: array
          maxItems: 100
          minItems: 1
          title: Messages
        max_tokens:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 1.0
          - type: 'null'
          title: Max Tokens
          description: 兼容旧参数并用于额度预留。
        max_completion_tokens:
          anyOf:
          - type: integer
            maximum: 4096.0
            minimum: 1.0
          - type: 'null'
          title: Max Completion Tokens
          description: 生成 token 上限，也用于额度预留。
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
          description: 采样温度；由上游模型决定是否支持。
        top_p:
          anyOf:
          - type: number
            maximum: 1.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Top P
          description: 核采样参数；由上游模型决定是否支持。
        presence_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Presence Penalty
          description: Presence penalty；具体支持范围以供应商为准。
        frequency_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Frequency Penalty
          description: Frequency penalty；具体支持范围以供应商为准。
        stop:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          - type: 'null'
          title: Stop
          description: 停止生成序列；按原样转发。
        response_format:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Response Format
          description: 如 json_object 或 json_schema；按原样转发给上游。
        tools:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Tools
          description: OpenAI function tools 定义；按原样转发给上游。
        tool_choice:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Tool Choice
          description: 工具选择策略；按原样转发。
        parallel_tool_calls:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Parallel Tool Calls
          description: 是否允许并行工具调用。
        logit_bias:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Logit Bias
          description: token 概率偏置映射。
        logprobs:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Logprobs
          description: 是否返回 token 对数概率。
        top_logprobs:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 0.0
          - type: 'null'
          title: Top Logprobs
          description: 返回的候选 token 概率数量。
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: 尽可能确定性采样的随机种子。
