openapi: 3.1.0
info:
  title: Agent Gateway API
  version: 0.1.0
  description: A1 统一认证和健康检查契约；业务端点将在后续阶段加入。
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: 检查应用进程是否可响应
      tags: [Health]
      responses:
        "200":
          description: 应用进程可响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: 检查应用是否可接收依赖数据库的请求
      description: 执行最小数据库查询；失败响应不包含连接串或底层异常文本。
      tags: [Health]
      responses:
        "200":
          description: 数据库连接正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: 数据库当前不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: 用户登录
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: 用户名或密码错误
  /api/v1/auth/register:
    post:
      operationId: register
      summary: 注册普通用户
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: 用户名已存在
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: 用户退出
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 当前令牌已撤销
        "401":
          description: 令牌无效或缺失
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: 获取当前用户
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前管理员公开信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: 令牌无效或缺失
  /api/admin/v1/projects:
    post:
      operationId: create_project
      summary: 创建项目
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    get:
      operationId: list_projects
      summary: 查询可访问项目
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
  /api/admin/v1/projects/{project_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: get_project
      summary: 查看项目
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
    patch:
      operationId: update_project
      summary: 更新项目
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
  /api/admin/v1/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: list_members
      summary: 查询项目成员
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 项目成员列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMemberResponse"
    post:
      operationId: add_member
      summary: 添加项目成员
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMemberRequest"
      responses:
        "201":
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
  /api/admin/v1/projects/{project_id}/members/{member_user_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: member_user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: remove_member
      summary: 移除项目成员
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 移除成功
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: 当前探针状态。
    ErrorResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          example: database_unavailable
          description: 供调用方稳定判断的错误码。
        message:
          type: string
          description: 可安全展示且不含底层敏感信息的消息。
        request_id:
          type: string
          description: 用于关联服务端日志的请求标识。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 256
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: 令牌有效期，单位为秒。
    UserResponse:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, user]
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
    ProjectUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [active, inactive]
    ProjectResponse:
      type: object
      required: [id, name, description, status, owner_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [active, inactive]
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectMemberRequest:
      type: object
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [editor, viewer]
    ProjectMemberResponse:
      type: object
      required: [project_id, user_id, role, created_at, updated_at]
      properties:
        project_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [owner, editor, viewer]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
