services:
  postgres:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - gateway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    image: agent-gateway-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      LOG_FILE_PATH: /var/log/gateway/gateway.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    networks:
      default: {}
      gateway_proxy:
        aliases:
          - agent-gateway-api
    volumes:
      - gateway_logs:/var/log/gateway
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend-assets:
    image: agent-gateway-frontend-build:local
    profiles: ["assets"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command: ["sh", "-c", "mkdir -p /output && cp -a /frontend/dist/. /output/"]
    volumes:
      - ./deploy/www:/output

volumes:
  gateway_pgdata:
  gateway_logs:

networks:
  gateway_proxy:
    name: gateway-proxy
    external: true
